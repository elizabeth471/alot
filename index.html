  // Space bar plays and stops, unless the focus is on something that uses it.
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    if (e.target !== document.body) return;
    e.preventDefault();
    playMix();
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (!bnRaf) bnDraw(0); }).observe(bnEl.canvas);
  }

  bnLoadStored();
  bnRenderControls();

  /* ═══════════════════════════════════════════
     NEURAL BEATS MIXER
     Binaural beats: the left and right ears get tones a few Hz apart.
     Everything shares one audio graph, so the Master fader covers it all.
     Tracks go through it too, because iPhones ignore volume set on audio files.
  ═══════════════════════════════════════════ */
  var MIX_STORE = 'alot.mixer.v1';
  var MIX_TYPES = [
    { name: 'Delta', rate: 2 },
    { name: 'Theta', rate: 6 },
    { name: 'Alpha', rate: 10 },
    { name: 'Beta', rate: 18 }
  ];
  var mixState = { rate: 10, pitch: 200, beats: 40, tracks: 80, master: 100, muted: false };
  var mixOscillators = null;
  var mixFade = null;
  var mixEl = {};
  ['mixTypes', 'mixRate', 'mixRateValue', 'mixPitch', 'mixPitchValue', 'mixBeats', 'mixBeatsBtn',
    'mixTracks', 'mixMaster'].forEach(function (id) {
    mixEl[id] = document.getElementById(id);
  });

  function mixLevel(v) { return (v / 100) * (v / 100); }

  function mixBus() {
    if (mixGraph) return mixGraph;
    var Context = window.AudioContext || window.webkitAudioContext;
    var ctx;
    // Asks for a larger audio buffer: a little slower to respond, far less prone to dropouts.
    try { ctx = new Context({ latencyHint: 'playback' }); } catch (e) { ctx = new Context(); }
    var g = { ctx: ctx };
    g.master = ctx.createGain();
    g.master.gain.value = mixLevel(mixState.master);
    g.tracks = ctx.createGain();
    g.tracks.gain.value = mixState.muted ? 0 : mixLevel(mixState.tracks);
    g.beats = ctx.createGain();
    g.beats.gain.value = mixLevel(mixState.beats) * 0.35; // plain tones are tiring when loud
    g.analyser = ctx.createAnalyser();
    g.analyser.fftSize = 1024;
    g.master.connect(g.analyser);
    g.limiter = ctx.createDynamicsCompressor();
    g.limiter.threshold.value = -3;
    g.limiter.ratio.value = 20;
    g.limiter.attack.value = 0.003;
    g.limiter.release.value = 0.25;
    g.tracks.connect(g.master);
    g.beats.connect(g.master);
    g.master.connect(g.limiter);
    g.limiter.connect(ctx.destination);
    ctx.addEventListener('statechange', function () {
      if (ctx.state !== 'running') soundCheck.interruptions++;
      bnResumeIfNeeded();
    });
    mixGraph = g;
    return g;
  }

  function mixApply() {
    if (playingAudio && !playingNode) playingAudio.volume = mixState.muted ? 0 : mixLevel(mixState.tracks);
    if (!mixGraph) return;
    var t = mixGraph.ctx.currentTime;
    mixGraph.master.gain.setTargetAtTime(mixLevel(mixState.master), t, 0.02);
    mixGraph.tracks.gain.setTargetAtTime(mixState.muted ? 0 : mixLevel(mixState.tracks), t, 0.02);
    mixGraph.beats.gain.setTargetAtTime(mixLevel(mixState.beats) * 0.35, t, 0.02);
    if (mixOscillators) {
      mixOscillators[0].frequency.setTargetAtTime(mixState.pitch - mixState.rate / 2, t, 0.05);
      mixOscillators[1].frequency.setTargetAtTime(mixState.pitch + mixState.rate / 2, t, 0.05);
    }
  }

  function mixSetBeats(on) {
    if (on) {
      bnPrepareAudioSession();
      var g = mixBus();
      g.ctx.resume();
      var merge = g.ctx.createChannelMerger(2);
      mixFade = g.ctx.createGain();
      var now = g.ctx.currentTime;
      mixFade.gain.setValueAtTime(0, now);
      mixFade.gain.linearRampToValueAtTime(1, now + 0.3);
      mixOscillators = [-1, 1].map(function (side, ear) {
        var osc = g.ctx.createOscillator();
        osc.frequency.value = mixState.pitch + side * mixState.rate / 2;
        osc.connect(merge, 0, ear);
        osc.start();
        return osc;
      });
      merge.connect(mixFade);
      mixFade.connect(g.beats);
    } else {
      var stopAt = mixGraph.ctx.currentTime + 0.3;
      mixFade.gain.cancelScheduledValues(mixGraph.ctx.currentTime);
      mixFade.gain.setValueAtTime(mixFade.gain.value, mixGraph.ctx.currentTime);
      mixFade.gain.linearRampToValueAtTime(0, stopAt);
      mixOscillators.forEach(function (osc) { osc.stop(stopAt); });
      mixOscillators = null;
      mixFade = null;
    }
    syncWakeLock();
    mixRender();
  }

  function routeTrack(audio) {
    bnPrepareAudioSession();
    var g = mixBus();
    g.ctx.resume();
    var node = g.ctx.createMediaElementSource(audio);
    var gain = g.ctx.createGain();
    gain.gain.value = 0;
    node.connect(gain);
    gain.connect(g.tracks);
    return { node: node, gain: gain };
  }

  // Screen readers announce sliders with their unit, not a bare number.
  function rangeText() {
    Array.prototype.forEach.call(document.querySelectorAll('input[type="range"]'), function (r) {
      r.setAttribute('aria-valuetext', r.value + (r.id === 'mixRate' || r.id === 'mixPitch' ? ' Hz' : '%'));
    });
  }
  document.addEventListener('input', function (e) {
    if (e.target.matches && e.target.matches('input[type="range"]')) rangeText();
  });

  function mixRender() {
    function show(input, value, min, max) {
      input.value = value;
      input.style.setProperty('--v', (value - min) / (max - min) * 100 + '%');
    }
    show(mixEl.mixRate, mixState.rate, 1, 30);
    show(mixEl.mixPitch, mixState.pitch, 100, 400);
    show(mixEl.mixBeats, mixState.beats, 0, 100);
    show(mixEl.mixTracks, mixState.tracks, 0, 100);
    show(mixEl.mixMaster, mixState.master, 0, 100);
    rangeText();
    mixEl.mixRateValue.textContent = mixState.rate + ' Hz';
    mixEl.mixPitchValue.textContent = mixState.pitch + ' Hz';
    mixEl.mixBeatsBtn.textContent = beatsWanted ? '■' : '▶';
    mixEl.mixBeatsBtn.setAttribute('aria-label', t(beatsWanted ? 'aria.stop.beats' : 'aria.play.beats'));
    mixEl.mixBeatsBtn.setAttribute('aria-pressed', String(beatsWanted));
    Array.prototype.forEach.call(mixEl.mixTypes.children, function (chip, i) {
      chip.setAttribute('aria-pressed', String(MIX_TYPES[i].rate === mixState.rate));
    });
    layersSync();
  }

  function mixChanged() {
    mixApply();
    mixRender();
    try { localStorage.setItem(MIX_STORE, JSON.stringify(mixState)); } catch (e) { /* lasts for this visit */ }
  }

  try {
    var mixStored = JSON.parse(localStorage.getItem(MIX_STORE));
    if (mixStored) {
      mixState.rate = Math.min(30, Math.max(1, Number(mixStored.rate) || mixState.rate));
      mixState.pitch = Math.min(400, Math.max(100, Number(mixStored.pitch) || mixState.pitch));
      ['beats', 'tracks', 'master'].forEach(function (k) {
        if (typeof mixStored[k] === 'number') mixState[k] = clamp(mixStored[k]);
      });
    }
  } catch (e) { /* nothing usable stored: start from the defaults */ }

  MIX_TYPES.forEach(function (type) {
    var chip = document.createElement('button');
    chip.className = 'bn-chip';
    var typeName = document.createElement('span');
    if (type.name === 'Alpha') typeName.setAttribute('data-t', 'beat.Alpha');
    else typeName.textContent = type.name;
    chip.appendChild(typeName);
    chip.appendChild(document.createTextNode(' · ' + type.rate + ' Hz'));
    chip.addEventListener('click', function () {
      mixState.rate = type.rate;
      mixChanged();
    });
    mixEl.mixTypes.appendChild(chip);
  });
  [['mixRate', 'rate'], ['mixPitch', 'pitch'], ['mixBeats', 'beats'], ['mixTracks', 'tracks'], ['mixMaster', 'master']].forEach(function (pair) {
    mixEl[pair[0]].addEventListener('input', function () {
      mixState[pair[1]] = Number(mixEl[pair[0]].value);
      mixChanged();
    });
  });
  mixEl.mixBeatsBtn.addEventListener('click', function () { setBeatsWanted(!beatsWanted); });
  mixRender();

  /* ═══════════════════════════════════════════
     TRACK LIBRARY
     Tracks come from tracks/manifest.json, each stored as a file.
  ═══════════════════════════════════════════ */
  var LIBRARY = [];
  var libraryBusy = {};

  var libraryOpen = {};
  function isAdded(def) {
    return recordings.some(function (r) { return r.libraryId === def.id; });
  }
  function addAlbum(defs) {
    return defs.reduce(function (chain, def) {
      return chain.then(function () { return addLibraryTrack(def); });
    }, Promise.resolve());
  }
  function libraryAddButton(label, disabled, click) {
    var button = document.createElement('button');
    button.className = 'take-btn library-add';
    button.disabled = disabled;
    button.textContent = t(disabled ? 'library.added' : 'library.add');
    button.setAttribute('aria-label', button.textContent + ': ' + label);
    button.addEventListener('click', click);
    return button;
  }
  function renderLibrary() {
    var list = document.getElementById('libraryList');
    var top = list.scrollTop;
    var albums = [];
    var byAlbum = {};
    LIBRARY.forEach(function (def) {
      var key = def.album || def.name;
      if (!byAlbum[key]) { byAlbum[key] = []; albums.push(key); }
      byAlbum[key].push(def);
    });
    list.textContent = '';
    albums.forEach(function (key) {
      var defs = byAlbum[key];
      var album = document.createElement('div');
      album.className = 'album';
      album.setAttribute('role', 'listitem');
      var row = document.createElement('div');
      row.className = 'album-row';
      var open = document.createElement('button');
      open.className = 'album-open';
      open.setAttribute('aria-expanded', String(!!libraryOpen[key]));
      var name = document.createElement('span');
      name.className = 'album-name';
      name.textContent = key;
      var meta = document.createElement('span');
      meta.className = 'album-meta';
      meta.textContent = t('library.' + defs[0].style) + ' · ' + defs.length;
      open.appendChild(name);
      open.appendChild(meta);
      open.addEventListener('click', function () {
        libraryOpen[key] = !libraryOpen[key];
        renderLibrary();
      });
      row.appendChild(open);
      row.appendChild(libraryAddButton(key, defs.every(isAdded), function () { addAlbum(defs); }));
      album.appendChild(row);
      if (libraryOpen[key]) {
        defs.forEach(function (def) {
          var item = document.createElement('div');
          item.className = 'take-item library-item';
          var title = document.createElement('div');
          title.className = 'take-name';
          title.textContent = def.name.split(' – ').pop();
          item.appendChild(title);
          item.appendChild(libraryAddButton(def.name, isAdded(def) || !!libraryBusy[def.id], function () { addLibraryTrack(def); }));
          album.appendChild(item);
        });
      }
      list.appendChild(album);
    });
    list.scrollTop = top;
  }

  function addLibraryTrack(def) {
    if (libraryBusy[def.id] || recordings.some(function (r) { return r.libraryId === def.id; })) return Promise.resolve();
    libraryBusy[def.id] = true;
    var ratedKey = ratingKey({ libraryId: def.id });
    if (ratings[ratedKey] < 0) { delete ratings[ratedKey]; saveRatings(); }
    renderLibrary();
    return Promise.resolve({ url: def.file, size: def.size || 0, duration: def.duration }).then(function (made) {
      recordings.push({
        id: nextId++,
        libraryId: def.id,
        name: def.name,
        size: made.size,
        url: made.url,
        duration: made.duration
      });
      libraryBusy[def.id] = false;
      renderTakes();
    }).catch(function () {
      libraryBusy[def.id] = false;
      renderLibrary();
      toast(t('err.play'), 'error');
    });
  }

  // Tracks from the music pipeline, listed in tracks/manifest.json. If it is missing or
  // unreadable, the library simply stays as it is.
  function loadPublishedTracks() {
    if (location.protocol === 'file:') return; // browsers refuse this on a page opened as a file
    return fetch('tracks/manifest.json', { cache: 'no-cache' }).then(function (response) {
      return response.ok ? response.json() : null;
    }).then(function (data) {
      if (!data || !Array.isArray(data.tracks)) return;
      data.tracks.forEach(function (track) {
        if (!track || !/^(?:tracks\/|https:\/\/pub-dfe2dc87a34d4016a8782237145e0938\.r2\.dev\/tracks\/)[a-z0-9-]+\.m4a$/.test(track.file) || !track.name) return;
        if (!/^[a-z]+$/.test(track.style) || !(Number(track.bpm) > 0) || !(Number(track.duration) > 0)) return;
        LIBRARY.push({
          id: 'file:' + track.file,
          name: String(track.name),
          style: track.style,
          bpm: Number(track.bpm),
          file: track.file,
          size: Number(track.size) || 0,
          duration: Number(track.duration),
          weight: Number(track.weight) > 0 ? Number(track.weight) : 1,
          album: track.album ? String(track.album) : '',
          intro: Number(track.intro) > 0 ? Number(track.intro) : 0
        });
      });
      renderLibrary();
    }).catch(function () { /* the built-in library still works */ });
  }
  loadPublishedTracks();


  /* ═══════════════════════════════════════════
     SETTINGS PANEL + LANGUAGE TOGGLE
  ═══════════════════════════════════════════ */
  var settingsEl = document.getElementById('settings');
  var gearEl = document.getElementById('gear');

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_STORE, JSON.stringify(settings)); } catch (e) { /* lasts for this visit */ }
  }

  function applySettings() {
    setTimeout(layersSync, 0); // words on the layer rows follow the language
    var root = document.documentElement;
    root.lang = settings.lang;
    root.setAttribute('data-layout', settings.layout);
    root.setAttribute('data-accent', settings.accent);
    root.setAttribute('data-text', settings.textSize);
    root.setAttribute('data-sliders', settings.sliderSize);
    root.setAttribute('data-controls', settings.controlSize);
    root.setAttribute('data-spacing', settings.spacing);
    root.setAttribute('data-panels', settings.panels);
    root.setAttribute('data-calm', String(settings.calm));
    root.style.setProperty('--bg-level', settings.bgLevel / 100);
    document.getElementById('setCalm').checked = settings.calm;
    document.getElementById('setBgLevel').value = settings.bgLevel;
    document.getElementById('setBgLevel').style.setProperty('--v', (settings.bgLevel - 15) / 85 * 100 + '%');
    rangeText();
    document.title = t('title');
    document.getElementById('metaDescription').setAttribute('content', t('meta'));
    translateIn(document);
    translateIn(emptyState);
    bnRenderControls();
    renderTakes();
    mixRender();
    bnMiniSync();
    bnUpdateMediaSession();
    Array.prototype.forEach.call(document.querySelectorAll('[data-set]'), function (el) {
      var parts = el.getAttribute('data-set').split(':');
      el.setAttribute('aria-pressed', String(settings[parts[0]] === parts[1]));
    });
    document.getElementById('setKeep').checked = settings.keepAwake;
    document.getElementById('playlistLoop').checked = settings.playlistLoop;
    document.getElementById('setBackground').checked = settings.background;
    if (settings.bg === 'still') bnDraw(0);
    bnStartVisual();
  }

  function openSettings(open) {
    settingsEl.hidden = !open;
    gearEl.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('settingsClose').focus();
    else gearEl.focus();
  }
  gearEl.addEventListener('click', function () { openSettings(settingsEl.hidden); });
  document.getElementById('settingsClose').addEventListener('click', function () { openSettings(false); });
  document.getElementById('settingsShade').addEventListener('click', function () { openSettings(false); });
  // On the document: Safari doesn't focus a switch when it is clicked.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !settingsEl.hidden) openSettings(false);
  });
  settingsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var items = settingsEl.querySelectorAll('button, input');
    var first = items[0];
    var last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-set]'), function (el) {
    el.addEventListener('click', function () {
      var parts = el.getAttribute('data-set').split(':');
      settings[parts[0]] = parts[1];
      saveSettings();
      applySettings();
    });
  });
  function setBackgroundMode(on) {
    var wasPlaying = bnPlaying;
    if (wasPlaying) bnSetPlaying(false);
    settings.background = on;
    saveSettings();
    document.getElementById('setBackground').checked = on;
    if (wasPlaying) bnSetPlaying(true);
  }
  document.getElementById('setBackground').addEventListener('change', function (e) { setBackgroundMode(e.target.checked); });
  document.getElementById('setCalm').addEventListener('change', function (e) {
    settings.calm = e.target.checked;
    saveSettings();
    applySettings();
  });
  document.getElementById('setBgLevel').addEventListener('input', function (e) {
    settings.bgLevel = Number(e.target.value);
    saveSettings();
    document.documentElement.style.setProperty('--bg-level', settings.bgLevel / 100);
    e.target.style.setProperty('--v', (settings.bgLevel - 15) / 85 * 100 + '%');
  });
  document.getElementById('playlistLoop').addEventListener('change', function (e) {
    settings.playlistLoop = e.target.checked;
    saveSettings();
  });
  document.getElementById('playlistNext').addEventListener('click', function () {
    var current = recordings.filter(function (r) { return r.id === playingId; })[0];
    if (current) playNext(current, true);
    else if (recordings.length) play(recordings[0]);
  });
  document.getElementById('setKeep').addEventListener('change', function (e) {
    settings.keepAwake = e.target.checked;
    saveSettings();
    syncWakeLock();
  });
  document.getElementById('settingsReset').addEventListener('click', function () {
    if (bgActive) setBackgroundMode(false);
    var lang = settings.lang;
    settings = Object.assign({}, SETTINGS_DEFAULT, { lang: lang });
    saveSettings();
    applySettings();
  });

  // Sound check: counts problems on this device, so a skip can be measured, not guessed at.
  setInterval(function () {
    var el = document.getElementById('soundCheck');
    var line = t('check.none');
    if (mixGraph) {
      var clock = mixGraph.ctx.currentTime;
      var wall = performance.now() / 1000;
      if (mixGraph.ctx.state === 'running' && soundCheck.clock !== null && !document.hidden) {
        var lost = (wall - soundCheck.wall) - (clock - soundCheck.clock);
        if (lost > 0.05) soundCheck.gaps++;
      }
      soundCheck.clock = clock;
      soundCheck.wall = wall;
      var stats = mixGraph.ctx.playbackStats || mixGraph.ctx.playoutStats;
      var dropouts = stats ? (stats.underrunEvents !== undefined ? stats.underrunEvents : stats.fallbackFramesEvents) : undefined;
      line = t('check.dropouts') + ': ' + (dropouts === undefined ? t('check.na') : dropouts) +
        ' · ' + t('check.gaps') + ': ' + soundCheck.gaps +
        ' · ' + t('check.interrupted') + ': ' + soundCheck.interruptions +
        ' · ' + t('check.state') + ': ' + mixGraph.ctx.state;
    }
    if (el.textContent !== line) el.textContent = line;
  }, 1000);

  // Lock-screen and headphone controls
  if ('mediaSession' in navigator) {
    var controls = {
      play: function () {
        if (!bnPlaying) bnSetPlaying(true);
        if (beatsWanted && !mixOscillators) mixSetBeats(true);
        if (playingAudio) { lastSource = 'tracks'; playingAudio.play().catch(function () {}); }
        else if (recordings.length) play(recordings[0]);
        bnUpdateMediaSession();
        layersSync();
      },
      pause: function () {
        if (bnPlaying) bnSetPlaying(false);
        if (mixOscillators) mixSetBeats(false);
        if (playingAudio) playingAudio.pause();
        bnUpdateMediaSession();
        layersSync();
      },
      stop: function () { stopMix(); },
      nexttrack: function () {
        var current = recordings.filter(function (r) { return r.id === playingId; })[0];
        if (current) playNext(current, true);
      }
    };
    Object.keys(controls).forEach(function (action) {
      try {
        navigator.mediaSession.setActionHandler(action, controls[action]);
      } catch (e) { /* this browser doesn't offer it */ }
    });
  }

  // Quick controls: shown once the main play button scrolls away
  var bnPlayInView = true;
  function bnMiniSync() {
    var on = mixIsPlaying();
    document.getElementById('bnMini').hidden = bnPlayInView;
    var button = document.getElementById('bnMiniPlay');
    button.textContent = on ? '■' : '▶';
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', t(on ? 'aria.stop.mix' : 'aria.play.mix'));
  }
  document.getElementById('bnMiniPlay').addEventListener('click', playMix);
  if (window.IntersectionObserver) {
    new IntersectionObserver(function (entries) {
      bnPlayInView = entries[entries.length - 1].isIntersecting;
      bnMiniSync();
    }).observe(bnEl.play);
  }

  /* ═══════════════════════════════════════════
     LAYERS: one play button for noise, music and beats together
  ═══════════════════════════════════════════ */
  var beatsWanted = false;
  var mixStarting = false;
  var layersReady = true;

  function mixIsPlaying() {
    return !!(bnPlaying || playingId !== null && playingId !== undefined || mixOscillators || mixStarting);
  }

  function layersSync() {
    if (!layersReady) return; // the page is still being set up
    var on = mixIsPlaying();
    bnEl.play.setAttribute('aria-pressed', String(on));
    bnEl.play.setAttribute('data-t-aria', on ? 'aria.stop.mix' : 'aria.play.mix');
    bnEl.play.setAttribute('aria-label', t(on ? 'aria.stop.mix' : 'aria.play.mix'));
    var noiseBtn = document.getElementById('noiseBtn');
    noiseBtn.textContent = bnPlaying ? '■' : '▶';
    noiseBtn.setAttribute('aria-pressed', String(bnPlaying));
    noiseBtn.setAttribute('aria-label', t(bnPlaying ? 'aria.stop.noise' : 'aria.play.noise'));
    document.querySelector('.playlist-bar').hidden = !recordings.length;
    var musicOn = playingId !== null && playingId !== undefined;
    var musicBtn = document.getElementById('musicBtn');
    musicBtn.textContent = musicOn ? '■' : '▶';
    musicBtn.setAttribute('aria-pressed', String(musicOn));
    musicBtn.setAttribute('aria-label', t(musicOn ? 'aria.stop.music' : 'aria.play.music'));
    var rec = currentRec();
    document.getElementById('layerMusicPick').textContent = rec ? rec.name : '—';
    var key = rec && ratingKey(rec);
    var like = document.getElementById('musicLike');
    like.disabled = !key;
    like.setAttribute('aria-pressed', String(!!key && ratings[key] > 0));
    document.getElementById('musicDislike').disabled = !key;
    bnMiniSync();
  }

  // Likes and dislikes live on this device. Copy my ratings is the only way they leave it.
  var RATING_STORE = 'alot.ratings.v1';
  var ratings = {};
  try { ratings = JSON.parse(localStorage.getItem(RATING_STORE)) || {}; } catch (e) { /* starts empty */ }
  function saveRatings() {
    try { localStorage.setItem(RATING_STORE, JSON.stringify(ratings)); } catch (e) { /* lasts for this visit */ }
  }
  function ratingKey(rec) {
    var found = /([a-z0-9-]+)\.m4a$/.exec(rec.libraryId || '');
    return found ? found[1] : null;
  }
  function currentRec() {
    return recordings.filter(function (r) { return r.id === playingId; })[0] || recordings[0] || null;
  }

  // A fresh random order from the whole library. Disliked tracks stay out and liked ones tend to come up sooner.
  function shufflePlaylist() {
    var existing = {};
    recordings.forEach(function (r) { if (r.libraryId) existing[r.libraryId] = r; });
    var pool = recordings.filter(function (r) { return !r.libraryId; }).map(function (r) {
      return { rec: r, order: -Math.log(1 - Math.random()) };
    });
    LIBRARY.forEach(function (def) {
      var key = ratingKey({ libraryId: def.id });
      if (ratings[key] < 0) return;
      var weight = (def.weight || 1) * (ratings[key] > 0 ? 3 : 1);
      pool.push({
        intro: def.intro || 0,
        rec: existing[def.id] || { id: nextId++, libraryId: def.id, name: def.name, size: def.size || 0, url: def.file, duration: def.duration },
        order: -Math.log(1 - Math.random()) / weight
      });
    });
    pool.sort(function (a, b) { return a.order - b.order; });
    // Some tracks open almost silent, which sounds broken as the very first thing heard.
    for (var i = 0; i < pool.length; i++) {
      if (!pool[i].intro || pool[i].intro < 2) { pool.unshift(pool.splice(i, 1)[0]); break; }
    }
    recordings = pool.map(function (x) { return x.rec; });
    renderTakes();
  }

  function startMusic() {
    if (!recordings.length) shufflePlaylist();
    if (recordings.length) {
      play(recordings[0]);
      renderTakes();
    }
    return Promise.resolve();
  }

  function playMix() {
    if (mixIsPlaying()) { stopMix(); return; }
    trackPlayers(); // phones only allow later starts if the players are unlocked by this tap
    mixStarting = true;
    bnSetPlaying(true);
    if (beatsWanted) mixSetBeats(true);
    startMusic().then(function () {
      mixStarting = false;
      layersSync();
    });
    layersSync();
  }

  function stopMix() {
    mixStarting = false;
    if (bnPlaying) bnSetPlaying(false);
    if (mixOscillators) mixSetBeats(false);
    stopPlayback();
    renderTakes();
    layersSync();
  }

  function setBeatsWanted(on) {
    beatsWanted = on;
    if (on && (bnPlaying || playingId !== null && playingId !== undefined) && !mixOscillators) mixSetBeats(true);
    if (!on && mixOscillators) mixSetBeats(false);
    mixRender();
  }

  document.getElementById('musicBtn').addEventListener('click', function () {
    if (playingId !== null && playingId !== undefined) {
      stopPlayback();
      renderTakes();
      return;
    }
    trackPlayers(); // phones only allow later starts if the players are unlocked by this tap
    startMusic();
  });
  document.getElementById('musicShuffle').addEventListener('click', function () {
    trackPlayers();
    shufflePlaylist();
    if (recordings.length) { play(recordings[0]); renderTakes(); }
  });
  document.getElementById('musicLike').addEventListener('click', function () {
    var key = currentRec() && ratingKey(currentRec());
    if (!key) return;
    if (ratings[key] > 0) delete ratings[key]; else ratings[key] = 1;
    saveRatings();
    layersSync();
  });
  document.getElementById('musicDislike').addEventListener('click', function () {
    var rec = currentRec();
    var key = rec && ratingKey(rec);
    if (!key) return;
    var was = ratings[key];
    var at = recordings.indexOf(rec);
    var wasPlaying = rec.id === playingId;
    ratings[key] = -1;
    saveRatings();
    recordings = recordings.filter(function (r) { return r !== rec; });
    if (wasPlaying) {
      if (recordings.length) play(recordings[Math.min(at, recordings.length - 1)], crossfadeSeconds() || 0.4);
      else stopPlayback();
    }
    renderTakes();
    toast(t('layer.dislike'), 'info', t('undo'), function () {
      if (was === undefined) delete ratings[key]; else ratings[key] = was;
      saveRatings();
      recordings.splice(Math.min(at, recordings.length), 0, rec);
      renderTakes();
    });
  });
  document.getElementById('ratingsCopy').addEventListener('click', function () {
    var text = JSON.stringify({ app: 'alot', exported: new Date().toISOString(), ratings: ratings }, null, 1);
    if (!navigator.clipboard) { toast(t('err.play'), 'error'); return; }
    navigator.clipboard.writeText(text).then(function () {
      toast(t('ratings.copied'), 'success');
    }).catch(function () { toast(t('err.play'), 'error'); });
  });

  function musicTab(library) {
    document.getElementById('paneLibrary').hidden = !library;
    document.getElementById('panePlaylist').hidden = library;
    document.getElementById('tabLibrary').setAttribute('aria-pressed', String(library));
    document.getElementById('tabPlaylist').setAttribute('aria-pressed', String(!library));
  }
  document.getElementById('tabPlaylist').addEventListener('click', function () { musicTab(false); });
  document.getElementById('tabLibrary').addEventListener('click', function () { musicTab(true); });

  /* ── Choosing a speaker: AirPlay takes plain players, so this moves the sound onto them first. ── */
  var speakerBtn = document.getElementById('speakerBtn');
  var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var HAS_AIRPLAY = !!(window.HTMLMediaElement && HTMLMediaElement.prototype.webkitShowPlaybackTargetPicker);
  var HAS_OUTPUT_PICKER = !!(navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput);
  speakerBtn.hidden = !(HAS_AIRPLAY || HAS_OUTPUT_PICKER || IS_IOS);

  function speakerWatch(el) {
    if (el.speakerWatched) return;
    el.speakerWatched = true;
    el.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', function () {
      speakerBtn.setAttribute('aria-pressed', String(!!el.webkitCurrentPlaybackTargetIsWireless));
    });
  }

  function speakerPlainPath() {
    var rec = recordings.filter(function (r) { return r.id === playingId; })[0];
    var moving = rec && playingNode;
    var at = moving ? playingAudio.currentTime : 0;
    if (moving) stopPlayback(0.1);
    if (!settings.background) setBackgroundMode(true);
    if (moving) {
      play(rec);
      var audio = playingAudio;
      audio.addEventListener('loadedmetadata', function jump() {
        audio.removeEventListener('loadedmetadata', jump);
        audio.currentTime = at;
      });
    }
  }

  speakerBtn.addEventListener('click', function () {
    if (HAS_OUTPUT_PICKER && !HAS_AIRPLAY) {
      navigator.mediaDevices.selectAudioOutput().then(function (device) {
        var sink = device.deviceId;
        if (mixGraph && mixGraph.ctx.setSinkId) mixGraph.ctx.setSinkId(sink).catch(function () {});
      }).catch(function () { /* closed without choosing */ });
      return;
    }
    if (!HAS_AIRPLAY) { toast(t('set.sonos'), 'info'); return; }
    speakerPlainPath();
    trackPlayers();
    var el = playingId !== null && playingAudio ? playingAudio : bgElement();
    if (!el.src) { el.src = BG_SILENCE; el.play().catch(function () {}); }
    speakerWatch(el);
    try { el.webkitShowPlaybackTargetPicker(); } catch (e) { toast(t('set.sonos'), 'info'); }
  });

  var LAYER_DRAWERS = { Noise: 'drawerNoise', Music: 'drawerMusic' };
  function layerToggle(name, open) {
    Object.keys(LAYER_DRAWERS).forEach(function (key) {
      var drawer = document.getElementById(LAYER_DRAWERS[key]);
      var show = key === name && (open === undefined ? drawer.hidden : open);
      drawer.hidden = !show;
      document.getElementById('layer' + key + 'Btn').setAttribute('aria-expanded', String(show));
    });
  }
  document.getElementById('noiseBtn').addEventListener('click', function () { bnSetPlaying(!bnPlaying); });
  document.getElementById('layerNoiseBtn').addEventListener('click', function () { layerToggle('Noise'); });
  document.getElementById('layerMusicBtn').addEventListener('click', function () { layerToggle('Music'); });
  // Older links to the Studio tab open the music list.
  function layerFromLink() { if (location.hash === '#studio') layerToggle('Music', true); }
  layerFromLink();
  window.addEventListener('hashchange', layerFromLink);
  layersSync();

  applySettings();
  bnMiniSync();

  // A file dropped just outside the box would otherwise replace the whole page.
  ['dragover', 'drop'].forEach(function (type) {
    window.addEventListener(type, function (e) { e.preventDefault(); });
  });
})();
</script>
</body>
</html>
