<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" id="metaDescription" content="">
  <meta name="theme-color" content="#0e0b09">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>alot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg:           #0e0b09;
      --surface:      #2a221b;
      --card:         rgba(34,27,21,0.58);
      --accent:       #f2c48d;
      --accent-light: rgba(var(--glow),0.14);
      --accent-btn:   #96592f;
      --red:          #ef7a6c;
      --red-light:    #3a1f1b;
      --text:         #f7efe4;
      --text-mid:     #ddd1c1;
      --text-muted:   #b5a897;
      --border:       rgba(255,232,205,0.15);
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.4);
      --shadow-md:    0 4px 20px rgba(0,0,0,0.5);
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    18px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: calc(14px * var(--text));
      line-height: 1.55;
    }

    /* ── TOP STRIPE ── */
    body::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, #4a7c59, #7aab8a, #c8a97a, #c06644);
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    }

    /* ── SKIP LINK (accessibility) ── */
    .skip-link {
      position: absolute; top: -100px; left: 12px;
      background: var(--accent); color: #10160f;
      padding: 8px 16px; border-radius: 0 0 8px 8px;
      font-weight: 600; font-size: calc(13px * var(--text)); text-decoration: none;
      z-index: 9999; transition: top 0.2s;
    }
    .skip-link:focus { top: 4px; }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 36px 20px 20px;
    }
    .brand-name {
      font-family: ui-serif, Georgia, 'Iowan Old Style', serif;
      font-size: calc(clamp(52px, 12vw, 80px) * var(--text));
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 2px 14px rgba(125,187,146,0.2);
    }

    /* ── MAIN ── */
    main {
      max-width: 700px; margin: 0 auto;
      padding: 0 16px 64px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .card:focus-within { box-shadow: var(--shadow-md); }

    .card-header {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--card), var(--bg) 200%);
    }
    .card-titles { flex: 1; }
    .card-title { font-size: calc(16px * var(--text)); font-weight: 700; color: var(--text); }
    .card-sub { font-size: calc(12px * var(--text)); color: var(--text-muted); margin-top: 2px; }
    .card-body { padding: 20px; }

    /* ── STEP 1: RECORD / UPLOAD ── */
    .rec-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px; align-items: start;
    }

    .upload-zone {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      padding: 28px 16px; min-height: 140px;
      border: 2px dashed var(--border); border-radius: var(--radius-md);
      cursor: pointer; background: var(--bg);
      transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .upload-zone:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
    #uploadMp3 { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .uz-main { font-size: calc(14px * var(--text)); font-weight: 700; color: var(--accent); }
    .uz-hint { font-size: calc(11px * var(--text)); color: var(--text-muted); }

    /* ── STEP 2: MY RECORDINGS ── */
    #takesList { display: flex; flex-direction: column; gap: 10px; min-height: 70px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 16px; color: var(--text-muted);
      gap: 7px; text-align: center;
    }
    .empty-title { font-weight: 700; font-size: calc(14px * var(--text)); color: var(--text-mid); }
    .empty-msg { font-size: calc(12px * var(--text)); max-width: 260px; line-height: 1.6; }

    .take-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 15px; background: var(--bg);
      border-radius: var(--radius-sm); border: 1px solid var(--border);
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .take-info { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .take-icon { font-size: calc(22px * var(--text)); flex-shrink: 0; }
    .take-name { font-size: calc(13px * var(--text)); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .take-meta { font-size: calc(11px * var(--text)); color: var(--text-muted); margin-top: 2px; }
    .take-btns { display: flex; gap: 8px; flex-shrink: 0; }
    .take-btn {
      height: 34px; padding: 0 13px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text-mid); font-size: calc(13px * var(--text));
      cursor: pointer; font-family: inherit; font-weight: 500;
      transition: all 0.15s;
    }
    .take-btn:hover { background: var(--surface); }
    .take-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .take-btn.del { color: var(--red); border-color: #6b3a34; }
    .take-btn.del:hover { background: var(--red-light); }

    /* ── MIXER ── */
    .mix-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin-top: 18px; }
    .mix-strips { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
    .mix-strip { display: grid; grid-template-columns: 124px 96px 1fr; align-items: center; gap: 12px; font-size: calc(13px * var(--text)); font-weight: 600; color: var(--text-mid); }
    .mix-strip .take-btn { padding: 0 6px; }
    .take-btn.mix-toggle[aria-pressed="true"], .take-btn.mix-toggle[aria-pressed="true"]:hover {
      background: var(--accent-btn); border-color: var(--accent-btn); color: #fff;
    }
    @media (max-width: 560px) {
      .mix-controls { grid-template-columns: 1fr; }
      .mix-strip { grid-template-columns: 86px 84px 1fr; gap: 8px; font-size: calc(12px * var(--text)); }
    }


    /* ── VIEWS & TABS ── */
    [hidden] { display: none !important; }
    .view { display: flex; flex-direction: column; gap: 14px; }
    .view-tabs {
      display: flex; width: max-content; max-width: calc(100% - 32px);
      margin: 0 auto 22px; padding: 4px; gap: 4px;
      background: var(--surface); border-radius: 100px;
    }
    .view-tab {
      display: flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 0 22px; border: none; border-radius: 100px;
      background: transparent; color: var(--text-mid);
      font-family: inherit; font-weight: 600; line-height: 1; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab[aria-selected="true"] { background: #4a4238; color: #fff; box-shadow: var(--shadow-sm); }
    .note-emoji { filter: invert(1); }
    .view-tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #c06644; animation: livePulse 1.6s ease-in-out infinite; }
    @keyframes livePulse { 50% { opacity: 0.35; } }

    /* ── BROWN NOISE ── */
    .bn-hero {
      position: relative; height: 360px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 22px 24px 18px; border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #1d120b, #3a2415);
      color: #f7efe4; border: 1px solid #3d2a1c; box-shadow: var(--shadow-md);
    }
    #bnCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bn-hero-top, .bn-play, .bn-volume { position: relative; }
    .bn-hero-top { text-align: center; }
    .bn-kicker { font-size: calc(10px * var(--text)); font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: #d9c4ab; }
    #bnName {
      margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-serif, Georgia, 'Iowan Old Style', serif; font-size: calc(32px * var(--text)); font-weight: 400; line-height: 1.35;
    }
    .bn-play {
      flex-shrink: 0; width: 88px; height: 88px; border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #f7efe4; color: #2a1a10; cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transition: transform 0.15s, background 0.15s;
    }
    .bn-play:hover { transform: scale(1.05); background: #fff; }
    .bn-play:active { transform: scale(0.97); }
    .bn-play:focus-visible { outline: 3px solid #f0b878; outline-offset: 4px; }
    .bn-play svg { width: 32px; height: 32px; fill: currentColor; }
    .bn-play .icon-play { margin-left: 4px; }
    .bn-play[aria-pressed="false"] .icon-stop, .bn-play[aria-pressed="true"] .icon-play { display: none; }
    .bn-volume { display: flex; align-items: center; gap: 12px; width: min(340px, 100%); font-size: calc(12px * var(--text)); font-weight: 600; color: #f7efe4; }

    .bn-range {
      --v: 50%; --on: var(--accent); --off: var(--border); --thumb: #f3eee6; --edge: var(--accent-btn);
      flex: 1; width: 100%; min-width: 0; height: 28px; margin: 0;
      background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none;
    }
    .bn-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--on) var(--v), var(--off) var(--v)); }
    .bn-range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--off); }
    .bn-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--on); }
    .bn-range::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
      background: var(--thumb); border: 2px solid var(--edge); box-shadow: var(--shadow-sm);
    }
    .bn-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--thumb); border: 2px solid var(--edge); }
    .bn-range:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .bn-range:disabled { cursor: not-allowed; opacity: 0.4; }
    .bn-volume .bn-range { --on: #f0b878; --off: rgba(255,255,255,0.28); --thumb: #f7efe4; --edge: #2a1a10; }
    .bn-volume .bn-range:focus-visible { outline-color: #f0b878; }

    .bn-panel { padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .bn-label { margin-bottom: 12px; font-size: calc(13px * var(--text)); font-weight: 700; color: var(--text); }
    .bn-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .bn-chip {
      min-height: 40px; padding: 0 18px; border: 1.5px solid var(--border); border-radius: 100px;
      background: var(--card); color: var(--text-mid); font: inherit; font-size: calc(13px * var(--text)); font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .bn-chip:hover { border-color: var(--accent); background: var(--accent-light); }
    .bn-chip[aria-pressed="true"] { background: var(--accent-btn); border-color: var(--accent-btn); color: #fff; }
    .bn-chip:focus-visible, .bn-btn:focus-visible, .bn-del:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .bn-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
    .bn-slider-name { display: block; font-size: calc(13px * var(--text)); font-weight: 600; color: var(--text-mid); }
    .bn-ends { display: flex; justify-content: space-between; font-size: calc(11px * var(--text)); color: var(--text-muted); }
    .bn-slider.off .bn-slider-name, .bn-slider.off .bn-ends { opacity: 0.55; }
    @media (max-width: 560px) { .bn-sliders { grid-template-columns: 1fr; } }

    .bn-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
    .bn-btn {
      min-height: 44px; padding: 0 18px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--card); color: var(--text-mid); font: inherit; font-size: calc(13px * var(--text)); font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .bn-btn:hover:not(:disabled) { background: var(--surface); }
    .bn-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .bn-btn.primary { flex: 1 1 220px; background: var(--accent-btn); border-color: var(--accent-btn); color: #fff; font-weight: 700; }
    .bn-btn.primary:hover { background: #2d5538; }
    #bnSaveForm { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #bnSaveName {
      flex: 1 1 180px; min-width: 0; min-height: 44px; padding: 0 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text); font: inherit; font-size: calc(14px * var(--text));
    }
    #bnSaveName:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    .bn-saved-item { display: inline-flex; max-width: 100%; }
    .bn-saved-item .bn-chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-right: none; border-radius: 100px 0 0 100px; }
    .bn-del {
      flex-shrink: 0; min-width: 40px; padding: 0 12px 0 10px; border: 1.5px solid var(--border); border-radius: 0 100px 100px 0;
      background: var(--card); color: var(--text-muted); font: inherit; font-size: calc(13px * var(--text)); cursor: pointer;
    }
    .bn-del:hover { background: var(--red-light); border-color: #6b3a34; color: var(--red); }
    .bn-empty { font-size: calc(13px * var(--text)); color: var(--text-muted); }
    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
      .bn-play, .bn-chip, .bn-btn, .view-tab { transition: none; }
    }

/* ── TOAST ── */
    #toastBox {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column;
      gap: 8px; pointer-events: none; align-items: center;
    }
    .toast {
      background: #2a241f; color: #fff; padding: 11px 22px;
      border-radius: 100px; font-size: calc(13px * var(--text)); font-weight: 600;
      opacity: 0; transform: translateY(10px);
      transition: all 0.25s ease; white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18); pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--accent-btn); }
    .toast.error { background: #c0392b; }
    .toast.info { background: #5a6a7a; }

    /* ── SELF-CONTAINED LOGO FONT ── */

    /* ── TOAST ACTION ── */
    .toast { display: inline-flex; align-items: center; gap: 12px; }
    .toast-action {
      min-height: 32px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.5); border-radius: 100px;
      background: transparent; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }

    /* ── IPHONE / TOUCH ── */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      -webkit-tap-highlight-color: transparent;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    #toastBox { bottom: calc(24px + env(safe-area-inset-bottom)); }
    button, label, input { touch-action: manipulation; }
    #bnSaveName { font-size: max(16px, calc(16px * var(--text))); } /* below 16px, iPhones zoom the page on focus */
    @media (pointer: coarse) {
      .view-tab, .bn-chip, .take-btn { min-height: 44px; }
      .take-btn { height: 44px; }
      .bn-del { min-width: 44px; }
      .bn-range { height: 44px; }
      .bn-range::-webkit-slider-thumb { width: 28px; height: 28px; margin-top: -11px; }
    }
    @media (hover: none) {
      .bn-play:hover { transform: none; background: #f7efe4; }
      .bn-chip:hover:not([aria-pressed="true"]) { background: var(--card); border-color: var(--border); }
      .bn-chip[aria-pressed="true"]:hover { background: var(--accent-btn); border-color: var(--accent-btn); }
      .bn-btn:hover:not(:disabled):not(.primary) { background: var(--card); }
      .bn-btn.primary:hover { background: var(--accent-btn); }
    }
    @media (max-width: 560px) {
      .take-item { flex-wrap: wrap; gap: 10px; }
      .take-info { width: 100%; }
      .take-btns { width: 100%; }
      .take-btn { flex: 1; min-width: 0; padding: 0 8px; }
    }
    /* ── LIVING LIGHT THEME ── */
    html { background: #0e0b09; }
    body {
      background: transparent;
      font-family: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif;
    }
    body::before { display: none; }
    #bnCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    header, .view-tabs, main { position: relative; z-index: 1; }

    .brand-name { font-weight: 400; color: var(--accent); text-shadow: 0 0 34px rgba(var(--glow),0.4); }
    .view-tabs {
      background: rgba(34,27,21,0.5); border: 1px solid var(--border);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .view-tab { font-family: ui-serif, Georgia, 'Iowan Old Style', serif; font-size: calc(16px * var(--text)); transition: background 0.3s, color 0.3s; }
    .view-tab[aria-selected="true"] { background: rgba(var(--glow),0.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(var(--glow),0.4); }

    .card, .bn-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    .card-header { background: none; }
    .card-title, .bn-label { font-family: ui-serif, Georgia, 'Iowan Old Style', serif; font-weight: 400; color: var(--text); }
    .card-title { font-size: calc(21px * var(--text)); }
    .bn-label { font-size: calc(17px * var(--text)); }
    .bn-label-gap { margin-top: 20px; }
    .bn-color { display: inline-flex; align-items: center; gap: 8px; }
    .bn-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .bn-hint { margin-left: 6px; font-size: calc(11px * var(--text)); font-weight: 400; color: var(--text-muted); }

    .bn-hero {
      height: clamp(340px, 56vh, 500px); padding: 8px 0 12px; overflow: visible;
      background: none; border: none; box-shadow: none;
    }
    .bn-kicker { color: var(--text-mid); }
    #bnName { font-family: ui-serif, Georgia, 'Iowan Old Style', serif; font-size: calc(44px * var(--text)); line-height: 1.2; text-shadow: 0 0 30px rgba(255,220,170,0.35); }
    .bn-play, .bn-play:hover {
      width: 108px; height: 108px; background: rgba(247,239,228,0.08); color: #fbeedb;
      border: 1px solid rgba(var(--glow),0.65);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow: 0 0 44px rgba(var(--glow),0.28), inset 0 0 26px rgba(var(--glow),0.12);
      transition: transform 0.35s cubic-bezier(.2,1.4,.4,1), box-shadow 0.35s;
    }
    .bn-play:active { transform: scale(0.94); }
    @media (hover: hover) {
      .bn-play:hover { transform: scale(1.05); box-shadow: 0 0 70px rgba(var(--glow),0.48), inset 0 0 30px rgba(var(--glow),0.18); }
      .bn-btn.primary:hover { box-shadow: 0 0 34px rgba(var(--glow),0.38); }
    }

    .bn-range::-webkit-slider-runnable-track { height: 3px; }
    .bn-range::-moz-range-track, .bn-range::-moz-range-progress { height: 3px; }
    .bn-range::-webkit-slider-thumb {
      width: 18px; height: 18px; margin-top: -7.5px; background: #fbeedb; border: none;
      box-shadow: 0 0 14px rgba(var(--glow),0.75);
    }
    .bn-range::-moz-range-thumb { width: 18px; height: 18px; background: #fbeedb; border: none; box-shadow: 0 0 14px rgba(var(--glow),0.75); }
    @media (pointer: coarse) { .bn-range::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -10.5px; } }
    .bn-volume .bn-range { --on: #f2c48d; --off: rgba(255,240,220,0.22); --thumb: #fbeedb; --edge: transparent; }

    play: document.getElementById('bnPlay'),
    name: document.getElementById('bnName'),
    volume: document.getElementById('bnVolume'),
    presets: document.getElementById('bnPresets'),
    sliders: document.getElementById('bnSliders'),
    generate: document.getElementById('bnGenerate'),
    prev: document.getElementById('bnPrev'),
    save: document.getElementById('bnSave'),
    saveForm: document.getElementById('bnSaveForm'),
    saveName: document.getElementById('bnSaveName'),
    saveCancel: document.getElementById('bnSaveCancel'),
    saved: document.getElementById('bnSaved'),
    canvas: document.getElementById('bnCanvas')

  var bnReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function bnColor(id) {
    return BN_COLORS.filter(function (c) { return c.id === id; })[0] || BN_COLORS[0];
  }

  function newSeed() { return Math.floor(Math.random() * 4294967295); }
  function clamp(v) { return Math.min(100, Math.max(0, Math.round(Number(v) || 0))); }

  function makeRandom(seed) {
    var a = seed >>> 0;
    return function () { // mulberry32
      a = (a + 0x6D2B79F5) >>> 0;

  /* ── Sound ── */
  var NOISE_LOOP_SECONDS = 30; // long enough that the repeat can't be picked out

  // Audio filter (standard biquad formulas), used to shape noise while it is generated.
  function makeFilter(type, freq, rate, q, gainDb) {
    var A = Math.pow(10, (gainDb || 0) / 40);
    var w = 2 * Math.PI * freq / rate;
    var cos = Math.cos(w);
    var alpha = Math.sin(w) / (2 * q);
    var b0, b1, b2, a0, a1, a2;
    if (type === 'bandpass') {
      b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cos; a2 = 1 - alpha;
    } else if (type === 'peak') {
      b0 = 1 + alpha * A; b1 = -2 * cos; b2 = 1 - alpha * A;
      a0 = 1 + alpha / A; a1 = -2 * cos; a2 = 1 - alpha / A;
    } else { // low shelf
      var root = 2 * Math.sqrt(A) * alpha;
      b0 = A * ((A + 1) - (A - 1) * cos + root);
      b1 = 2 * A * ((A - 1) - (A + 1) * cos);
      b2 = A * ((A + 1) - (A - 1) * cos - root);
      a0 = (A + 1) + (A - 1) * cos + root;
      a1 = -2 * ((A - 1) + (A + 1) * cos);
      a2 = (A + 1) + (A - 1) * cos - root;
    }
    var x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    return function (x) {
      var y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = x; y2 = y1; y1 = y;
      return y;
    };
  }

  function makePink(random) { // Paul Kellet's pink noise filter
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    return function () {
      var w = random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      var out = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
      b6 = w * 0.115926;
      return out;
    };
  }

  function makeNoiseSource(color, random, rate) {
    var last = 0;
    var pink;
    if (color === 'pink') return makePink(random);
    if (color === 'white') return function () { return random() * 2 - 1; };
    if (color === 'blue') { // rises with pitch: the change between pink samples
      pink = makePink(random);
      return function () { var p = pink(); var out = p - last; last = p; return out; };
    }
    if (color === 'violet') { // rises faster: the change between white samples
      return function () { var w = random() * 2 - 1; var out = w - last; last = w; return out; };
    }
    if (color === 'green') { // centred on the middle of the range
      var band = makeFilter('bandpass', 500, rate, 0.6);
      return function () { return band(random() * 2 - 1); };
    }
    if (color === 'gray') { // shaped to sound roughly even to the ear
      var lows = makeFilter('lowshelf', 300, rate, 0.7, 15);
      var dip = makeFilter('peak', 3500, rate, 0.6, -15);
      return function () { return dip(lows(random() * 2 - 1)); };
    }
    return function () { // brown: each sample drifts from the last
      last = (last + 0.02 * (random() * 2 - 1)) / 1.02;
      return last;
    };
  }

  function makeNoiseBuffer(ctx, seed, colorId) {
    var rate = ctx.sampleRate;
    var loopLength = rate * NOISE_LOOP_SECONDS;
    var overlap = rate; // 1 second, blended so the loop point can't be heard
    var random = makeRandom(seed);
    var buffer = ctx.createBuffer(2, loopLength, rate);
    var channels = [buffer.getChannelData(0), buffer.getChannelData(1)];
    var color = bnColor(colorId);
    var energy = 0;
    var peak = 0;
    var c, i;
    for (c = 0; c < 2; c++) {
      var next = makeNoiseSource(color.id, random, rate);
      var raw = new Float32Array(loopLength + overlap);
      for (i = 0; i < raw.length; i++) raw[i] = next();
      var out = channels[c];
      for (i = 0; i < loopLength; i++) {
        if (i < overlap) {
          var mix = i / overlap;
          out[i] = raw[i] * Math.sqrt(mix) + raw[loopLength + i] * Math.sqrt(1 - mix);
        } else {
          out[i] = raw[i];
        }
        energy += out[i] * out[i];
        peak = Math.max(peak, Math.abs(out[i]));
      }
    }
    // Level differs by colour: bright noise sounds far louder at the same strength.
    var gain = color.level / Math.sqrt(energy / (loopLength * 2));
    if (peak * gain > 0.95) gain = 0.95 / peak;
    for (c = 0; c < 2; c++) {
      for (i = 0; i < loopLength; i++) channels[c][i] *= gain;
    }
    return buffer;
  }

  function bnBuildAudio() {
    var bus = mixBus();
    return bnWire(bus.ctx, bus.master);
  }

  function bnWire(ctx, output) {
    var a = { ctx: ctx };
    a.master = ctx.createGain();
    a.master.gain.value = bnVolumeLevel();
    a.input = ctx.createGain();
    a.input.gain.value = 0.8; // headroom for the Rumble boost
    a.lowShelf = ctx.createBiquadFilter();
    a.lowShelf.type = 'lowshelf';
    a.lowShelf.frequency.value = 120;
    a.lowPass = ctx.createBiquadFilter();
    a.lowPass.type = 'lowpass';
    a.highShelf = ctx.createBiquadFilter();
    a.highShelf.type = 'highshelf';
    a.highShelf.frequency.value = 1500;
    a.swell = ctx.createGain();
    a.lfo = ctx.createOscillator();
    a.lfoLevel = ctx.createGain();
    a.lfoTone = ctx.createGain();
    a.lfo.connect(a.lfoLevel);
    a.lfoLevel.connect(a.swell.gain);
    a.lfo.connect(a.lfoTone);
    a.lfoTone.connect(a.lowPass.detune);
    a.lfo.start();

    // Drift: two very slow, unrelated movements, so the tone keeps wandering.
    a.driftLevel = ctx.createGain();
    a.driftLevel.connect(a.lowPass.detune);
    [0.013, 0.037].forEach(function (rate) {
      var slow = ctx.createOscillator();
      slow.frequency.value = rate;
      slow.connect(a.driftLevel);
      slow.start();
    });

    // Space: blends left and right, from one shared signal to two separate ones.
    var split = ctx.createChannelSplitter(2);
    var merge = ctx.createChannelMerger(2);
    a.straight = [ctx.createGain(), ctx.createGain()];
    a.crossed = [ctx.createGain(), ctx.createGain()];
    split.connect(a.straight[0], 0);
    a.straight[0].connect(merge, 0, 0);
    split.connect(a.crossed[0], 1);
    a.crossed[0].connect(merge, 0, 0);
    split.connect(a.straight[1], 1);
    a.straight[1].connect(merge, 0, 1);
    split.connect(a.crossed[1], 0);
    a.crossed[1].connect(merge, 0, 1);

    a.input.connect(a.lowShelf);
    a.lowShelf.connect(a.lowPass);
    a.lowPass.connect(a.highShelf);
    a.highShelf.connect(a.swell);
    a.swell.connect(split);
    merge.connect(a.master);
    a.master.connect(output);
    return a;
  }

  function bnVolumeLevel() {
    // Squared so the slider feels even, since hearing is not linear.
    var v = bnEl.volume.value / 100;
    return v * v;
  }

  function bnGrainAmount() {
    return (bn.grain / 100) * (bn.grain / 100) * 0.9;
  }

  // Grain: soft, scattered ticks, like rain or a distant fire.
  function makeGrainBuffer(ctx, seed) {
    var rate = ctx.sampleRate;
    var length = rate * NOISE_LOOP_SECONDS;
    var random = makeRandom(seed ^ 0x5bd1e995);
    var buffer = ctx.createBuffer(2, length, rate);
    for (var c = 0; c < 2; c++) {
      var out = buffer.getChannelData(c);
      for (var n = 0; n < NOISE_LOOP_SECONDS * 45; n++) {
        var at = Math.floor(random() * length);
        var size = Math.pow(random(), 3) * 0.8 + 0.03;
        var ring = Math.floor(rate * (0.001 + random() * 0.007));
        for (var i = 0; i < ring; i++) {
          out[(at + i) % length] += (random() * 2 - 1) * size * Math.exp(-5 * i / ring);
        }
      }
      var body = makeFilter('bandpass', 2400, rate, 0.5);
      var peak = 0;
      // The first pass only settles the filter, so the end of the loop meets its start cleanly.
      for (var settle = 0; settle < length; settle++) body(out[settle]);
      for (var k = 0; k < length; k++) {
        out[k] = body(out[k]);
        peak = Math.max(peak, Math.abs(out[k]));
      }
      for (var m = 0; m < length; m++) out[m] = out[m] / (peak || 1) * 0.6;
    }
    return buffer;
  }

  function bnApplySound(target) {
    if (!target) bgQueue();
    var a = target || bnAudio;
    if (!a) return;
    var t = a.ctx.currentTime;
    function glide(param, value) { param.setTargetAtTime(value, t, 0.08); }
    // Brown is already dark, so Tone works over a lower range for it than for the rest.
    glide(a.lowPass.frequency, bn.color === 'brown' ?
      120 * Math.pow(4000 / 120, bn.tone / 100) :
      Math.min(20000, 400 * Math.pow(50, bn.tone / 50)));
    glide(a.highShelf.gain, (bn.tone - 50) / 50 * 8);
    glide(a.lowShelf.gain, -8 + bn.rumble / 100 * 16);
    var swellAmount = bn.swell / 100 * 0.7;
    glide(a.swell.gain, 1 - swellAmount / 2);
    glide(a.lfoLevel.gain, swellAmount / 2);
    glide(a.lfoTone.gain, swellAmount * 900);
    glide(a.driftLevel.gain, bn.drift / 100 * 700);
    if (!target && bnGrainLevel) glide(bnGrainLevel.gain, bnGrainAmount());
    glide(a.lfo.frequency, 0.03 * Math.pow(10, bn.pace / 100));
    var width = bn.space / 100;
    var same = (1 + width) / 2;
    var other = (1 - width) / 2;
    var norm = Math.sqrt(same * same + other * other);
    [0, 1].forEach(function (c) {
      glide(a.straight[c].gain, same / norm);
      glide(a.crossed[c].gain, other / norm);
    });
  }

  function bnStartSource(fadeSeconds) {
    var a = bnAudio;
    var bufferKey = bn.seed + ':' + bn.color;
    if (bnBufferSeed !== bufferKey) {
      bnBuffer = makeNoiseBuffer(a.ctx, bn.seed, bn.color);
      bnBufferSeed = bufferKey;
    }
    bnSource = a.ctx.createBufferSource();
    bnSource.buffer = bnBuffer;
    bnSource.loop = true;
    bnSourceFade = a.ctx.createGain();
    var now = a.ctx.currentTime;
    bnSourceFade.gain.setValueAtTime(0, now);
    bnSourceFade.gain.linearRampToValueAtTime(1, now + fadeSeconds);
    bnSource.connect(bnSourceFade);
    bnSourceFade.connect(a.input);
    bnSource.start();

    if (bnGrainSeed !== bn.seed) {
      bnGrainBuffer = makeGrainBuffer(a.ctx, bn.seed);
      bnGrainSeed = bn.seed;
    }
    bnGrainSource = a.ctx.createBufferSource();
    bnGrainSource.buffer = bnGrainBuffer;
    bnGrainSource.loop = true;
    bnGrainLevel = a.ctx.createGain();
    bnGrainLevel.gain.value = bnGrainAmount();
    bnGrainFade = a.ctx.createGain();
    bnGrainFade.gain.setValueAtTime(0, now);
    bnGrainFade.gain.linearRampToValueAtTime(1, now + fadeSeconds);
    bnGrainSource.connect(bnGrainLevel);
    bnGrainLevel.connect(bnGrainFade);
    bnGrainFade.connect(a.swell); // skips the Tone filter, or dark settings would swallow it
    bnGrainSource.start();
  }

  function bnStopSource(fadeSeconds) {
    var now = bnAudio.ctx.currentTime;
    bnSourceFade.gain.cancelScheduledValues(now);
    bnSourceFade.gain.setValueAtTime(bnSourceFade.gain.value, now);
    bnSourceFade.gain.linearRampToValueAtTime(0, now + fadeSeconds);
    bnSource.stop(now + fadeSeconds);
    bnSource = null;
    bnSourceFade = null;
    bnGrainFade.gain.cancelScheduledValues(now);
    bnGrainFade.gain.setValueAtTime(bnGrainFade.gain.value, now);
    bnGrainFade.gain.linearRampToValueAtTime(0, now + fadeSeconds);
    bnGrainSource.stop(now + fadeSeconds);
    bnGrainSource = null;
    bnGrainLevel = null;
    bnGrainFade = null;
  }

  function bnSetPlaying(on) {
    if (on) {
      bnPrepareAudioSession();
      if (settings.background) {
        bgStart();
      } else {
        if (!bnAudio) bnAudio = bnBuildAudio();
        bnAudio.ctx.resume();
        bnApplySound();
        bnStartSource(BN_FADE);
      }
    } else if (bgActive) {
      bgStop();
    } else {
      bnStopSource(BN_FADE);
    }
    bnPlaying = on;
    if (on) lastSource = 'noise';
    bnPulse = 1;
    bnUpdateMediaSession();
    syncWakeLock();
    layersSync();
    bnStartVisual();
  }

  /* ── iPhone audio: play through the silent switch, recover after interruptions ── */
  function bnPrepareAudioSession() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* older Safari */ }
  }

  function bnUpdateMediaSession() {
    if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
    try {
      var track = recordings.filter(function (r) { return r.id === playingId; })[0];
      var showTrack = lastSource === 'tracks' && track;
      navigator.mediaSession.metadata = new MediaMetadata({ title: showTrack ? track.name : bnDisplayName(), artist: 'alot' });
      var active = lastSource === 'tracks' ? (playingAudio && !playingAudio.paused) : bnPlaying;
      navigator.mediaSession.playbackState = active ? 'playing' : 'paused';
    } catch (e) { /* lock-screen details are optional */ }
  }

  function bnResumeIfNeeded() {
    if (!mixGraph || mixGraph.ctx.state === 'running') return;
    if (!bnPlaying && !mixOscillators && playingId === null) return;
    var resuming = mixGraph.ctx.resume();
    if (resuming && resuming.catch) resuming.catch(function () { /* needs a tap: stop and play again */ });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) bnResumeIfNeeded();
  });
  window.addEventListener('pageshow', bnResumeIfNeeded);

  /* ── Living background: threads of light shaped by the settings and the sound ── */
  var bnPulse = 0;
  var bnLastFrame = 0;
  var bnFrameSeen = 0;
  var bnSlowFrames = 0;
  var bnLowPower = false; // simpler drawing on a struggling phone, so sound keeps priority

  function bnCalm() {
    return bnReducedMotion || settings.calm;
  }

  function bnAnySound() {
    return !!mixGraph && (bnPlaying || !!mixOscillators || playingId !== null);
  }

  function bnThreadColor(ribbon, tone, alpha) {
    var low = [[176, 96, 52], [150, 84, 66], [190, 120, 62], [120, 96, 84], [170, 108, 72]][ribbon];
    var high = [[255, 214, 160], [255, 196, 178], [236, 232, 198], [176, 222, 214], [255, 226, 186]][ribbon];
    var tint = bnColor(bn.color).tint;
    return 'rgba(' + low.map(function (v, i) {
      var c = v + (high[i] - v) * tone;
      return Math.round(tint ? c * 0.35 + tint[i] * 0.65 : c);
    }).join(',') + ',' + alpha + ')';
  }

  /* ── Backgrounds that answer to touch as well as sound ── */
  var bgPointer = { x: 0, y: 0, time: -Infinity };
  var bgRipples = [];
  var bgNextRipple = 0;
  var bgFlies = [];

  function bgTouched(e) {
    bgPointer.x = e.clientX;
    bgPointer.y = e.clientY;
    bgPointer.time = performance.now();
  }
  window.addEventListener('pointermove', bgTouched, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    bgTouched(e);
    if (settings.bg === 'ripples') bgRipples.push({ x: e.clientX, y: e.clientY, born: performance.now(), size: 1 });
  }, { passive: true });

  function bgNear(now) {
    return now - bgPointer.time < 2500;
  }

  function drawRipples(g, w, h, now, tone, life, pace, rumble) {
    if (!now) { // a still picture for Less motion
      [[0.3, 0.3, 1400], [0.7, 0.55, 900], [0.45, 0.75, 500]].forEach(function (r) {
        bgRipples.push({ x: r[0] * w, y: r[1] * h, born: -r[2], size: 1 });
      });
    } else if (now > bgNextRipple) { // rain on the surface, faster when the sound is strong
      bgRipples.push({ x: Math.random() * w, y: Math.random() * h, born: now, size: 0.55 + Math.random() * 0.5 });
      bgNextRipple = now + 1500 - life * 1100;
    }
    var keep = [];
    bgRipples.forEach(function (r, i) {
      var age = (now - r.born) / 3600;
      if (age >= 1) return;
      keep.push(r);
      for (var ring = 0; ring < 3; ring++) {
        var spread = age - ring * 0.08;
        if (spread <= 0) continue;
        g.beginPath();
        g.arc(r.x, r.y, spread * Math.max(w, h) * 0.4 * r.size * (0.7 + pace), 0, 6.29);
        g.strokeStyle = bnThreadColor(i % 5, tone, (1 - age) * (1 - ring * 0.25) * (0.62 + 0.38 * life));
        g.lineWidth = 1.1 + rumble * 1.6;
        g.stroke();
      }
    });
    bgRipples = keep.slice(-16);
    if (!now) bgRipples = [];
  }

  function drawFireflies(g, w, h, now, tone, life, pace, space) {
    var count = bnLowPower ? 18 : (w < 600 ? 32 : 60);
    while (bgFlies.length < count) {
      bgFlies.push({ x: Math.random() * w, y: Math.random() * h, vx: 0, vy: 0, phase: Math.random() * 6.28, seed: Math.random() * 6.28 });
    }
    var near = bgNear(now);
    bgFlies.slice(0, count).forEach(function (f, i) {
      var clock = now * 0.0004 * (0.5 + pace);
      f.vx += Math.cos(clock + f.seed * 3) * 0.06 * (0.6 + space);
      f.vy += Math.sin(clock * 1.3 + f.seed * 5) * 0.06;
      if (near) { // they drift towards a finger
        var dx = bgPointer.x - f.x;
        var dy = bgPointer.y - f.y;
        var far = Math.max(40, Math.sqrt(dx * dx + dy * dy));
        f.vx += dx / far * 0.22;
        f.vy += dy / far * 0.22;
      }
      f.vx *= 0.95;
      f.vy *= 0.95;
      f.x = (f.x + f.vx + w) % w;
      f.y = (f.y + f.vy + h) % h;
      var glow = Math.max(0, 0.45 + 0.55 * Math.sin(now * 0.0016 + f.phase)) * (0.45 + 0.55 * life + (near ? 0.2 : 0));
      var size = 2 + life * 2;
      g.fillStyle = bnThreadColor(i % 5, Math.min(1, tone + 0.3), glow * 0.22);
      g.beginPath();
      g.arc(f.x, f.y, size * 7, 0, 6.29);
      g.fill();
      g.fillStyle = bnThreadColor(i % 5, Math.min(1, tone + 0.45), glow);
      g.beginPath();
      g.arc(f.x, f.y, size, 0, 6.29);
      g.fill();
    });
  }

  function drawConstellation(g, w, h, now, tone, life, t, space) {
    var field = makeRandom(1804);
    var count = bnLowPower ? 28 : (w < 600 ? 44 : 78);
    var near = bgNear(now);
    var reach = Math.min(w, h) * (0.14 + 0.1 * space + 0.08 * life);
    var dots = [];
    for (var i = 0; i < count; i++) {
      var x = field() * w + Math.sin(t * 3 + i) * 16;
      var y = field() * h + Math.cos(t * 2.4 + i * 1.7) * 16;
      if (near) { // the sky leans towards a finger
        var dx = bgPointer.x - x;
        var dy = bgPointer.y - y;
        var far = Math.sqrt(dx * dx + dy * dy);
        if (far < 240) {
          x += dx * (1 - far / 240) * 0.3;
          y += dy * (1 - far / 240) * 0.3;
        }
      }
      dots.push([x, y]);
    }
    g.lineWidth = 0.8;
    dots.forEach(function (a, n) {
      for (var m = n + 1; m < dots.length; m++) {
        var gapX = a[0] - dots[m][0];
        var gapY = a[1] - dots[m][1];
        var gap = gapX * gapX + gapY * gapY;
        if (gap < reach * reach) {
          g.strokeStyle = bnThreadColor(n % 5, tone, (1 - Math.sqrt(gap) / reach) * (0.42 + 0.45 * life));
          g.beginPath();
          g.moveTo(a[0], a[1]);
          g.lineTo(dots[m][0], dots[m][1]);
          g.stroke();
        }
      }
      if (near) {
        var toX = a[0] - bgPointer.x;
        var toY = a[1] - bgPointer.y;
        var to = Math.sqrt(toX * toX + toY * toY);
        if (to < 200) {
          g.strokeStyle = bnThreadColor(n % 5, Math.min(1, tone + 0.3), (1 - to / 200) * 0.55);
          g.beginPath();
          g.moveTo(a[0], a[1]);
          g.lineTo(bgPointer.x, bgPointer.y);
          g.stroke();
        }
      }
      g.fillStyle = bnThreadColor(n % 5, Math.min(1, tone + 0.4), 0.8 + 0.2 * life);
      g.beginPath();
      g.arc(a[0], a[1], 1.6 + life * 1.6, 0, 6.29);
      g.fill();
    });
  }

  function drawAurora(g, w, h, now, tone, life, t, swell, rumble) {
    var near = bgNear(now);
    var step = bnLowPower ? 28 : 14;
    var palette = [[110, 255, 190], [110, 215, 255], [205, 150, 255]];
    palette.forEach(function (color, layer) {
      for (var x = 0; x <= w + step; x += step) {
        var u = x / w;
        var ray = Math.pow(0.5 + 0.5 * Math.sin(u * (34 + layer * 9) + t * (5 + layer * 2) + layer * 2.1), 2);
        var curtain = 0.45 + 0.55 * Math.sin(u * (3 + layer) + t * (1.5 + layer * 0.5) + layer * 1.7);
        var top = h * (0.06 + layer * 0.07) + Math.sin(u * (2.4 + layer) + t * (1.2 + layer * 0.4) + layer * 2) * h * (0.05 + 0.04 * rumble);
        var touch = 0;
        if (near) {
          var gap = Math.abs(x - bgPointer.x) / 190;
          if (gap < 1) touch = 1 - gap; // rays gather and brighten under a finger
        }
        var length = h * (0.32 + 0.2 * swell + 0.22 * life + 0.26 * touch);
        var alpha = Math.max(0, curtain) * (0.1 + 0.5 * ray) * (0.28 + 0.5 * life) + touch * (0.08 + 0.3 * ray);
        if (alpha <= 0.004) continue;
        var rgb = color[0] + ',' + color[1] + ',' + color[2];
        var shade = g.createLinearGradient(0, top, 0, top + length);
        shade.addColorStop(0, 'rgba(' + rgb + ',0)');
        shade.addColorStop(0.3, 'rgba(' + rgb + ',' + alpha + ')');
        shade.addColorStop(1, 'rgba(' + rgb + ',0)');
        g.fillStyle = shade;
        g.fillRect(x, top, step + 1, length);
      }
    });
  }

  function bnDraw(now) {
    var canvas = bnEl.canvas;
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    if (!w || !h) return;
    var small = w < 600;
    var dpr = bnLowPower ? 1 : Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    var g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);

    var tone = bn.tone / 100;
    var rumble = bn.rumble / 100;
    var swell = bn.swell / 100;
    var space = bn.space / 100;
    var life = Math.min(1.4, bnLevel + bnPulse * 0.7);
    var t = now * 0.00007 * (0.5 + (bn.pace / 100) * 1.5);

    var glow = g.createRadialGradient(w / 2, h * 0.36, 0, w / 2, h * 0.36, Math.max(w, h) * (0.5 + life * 0.25));
    glow.addColorStop(0, bnThreadColor(0, tone, 0.2 + life * 0.22));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, w, h);

    g.globalCompositeOperation = 'lighter';
    if (settings.bg === 'ripples') drawRipples(g, w, h, now, tone, life, bn.pace / 100, rumble);
    else if (settings.bg === 'fireflies') drawFireflies(g, w, h, now, tone, life, bn.pace / 100, space);
    else if (settings.bg === 'constellation') drawConstellation(g, w, h, now, tone, life, t, space);
    else if (settings.bg === 'aurora') drawAurora(g, w, h, now, tone, life, t, swell, rumble);
    if (['ripples', 'fireflies', 'constellation', 'aurora'].indexOf(settings.bg) >= 0) {
      g.globalCompositeOperation = 'source-over';
      return;
    }
    if (settings.bg === 'stars' || settings.bg === 'mist') {
      var field = makeRandom(20261103);
      var count = settings.bg === 'stars' ? (small ? 110 : 220) : 6;
      for (var p = 0; p < count; p++) {
        var fx = field();
        var fy = field();
        var ph = field() * 6.28;
        var sp = 0.4 + field() * 1.6;
        if (settings.bg === 'stars') {
          var twinkle = 0.45 + 0.55 * Math.sin(now * 0.0012 * sp + ph);
          var sx = (fx + 0.012 * Math.sin(t * sp + ph) * (1 + space * 2)) * w;
          var sy = ((fy + t * 0.03 * sp) % 1) * h;
          g.fillStyle = bnThreadColor(p % 5, tone, Math.max(0, twinkle) * (0.35 + 0.5 * life));
          g.beginPath();
          g.arc(sx, sy, 0.6 + field() * 1.3 + life * 1.4 + rumble * 0.5, 0, 6.29);
          g.fill();
        } else {
          var mx = (fx + 0.22 * Math.sin(t * 1.6 * sp + ph)) * w;
          var my = (fy + 0.16 * Math.cos(t * 1.2 * sp + ph)) * h;
          var mr = Math.max(w, h) * (0.3 + 0.16 * space + 0.2 * life);
          var cloud = g.createRadialGradient(mx, my, 0, mx, my, mr);
          cloud.addColorStop(0, bnThreadColor(p % 5, tone, 0.1 + 0.14 * life + 0.05 * swell));
          cloud.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = cloud;
          g.fillRect(0, 0, w, h);
        }
      }
      g.globalCompositeOperation = 'source-over';
      return;
    }
    g.lineWidth = 0.6 + rumble * 1.1;
    var threads = bnLowPower ? 6 : (small ? 10 : 16);
    var step = bnLowPower ? 18 : (small ? 12 : 8);
    for (var r = 0; r < 5; r++) {
      var baseY = h * (0.18 + r * 0.16);
      var amp = h * (0.05 + 0.1 * swell + 0.05 * rumble + 0.1 * life);
      var spread = h * (0.04 + 0.12 * space + 0.05 * swell + 0.08 * life);
      var waves = 1.6 + r * 0.6;
      for (var i = 0; i < threads; i++) {
        var off = i / (threads - 1) - 0.5;
        g.beginPath();
        for (var x = 0; x <= w + step; x += step) {
          var u = x / w;
          var y = baseY +
            Math.sin(u * waves * Math.PI + t * (1 + r * 0.4) + r * 1.9) * amp +
            off * spread * (1 + 0.8 * Math.sin(u * 4 + t * 1.7 + r)) +
            Math.sin(u * 9 + t * 2.3 + i * 0.25) * h * 0.006;
          if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.strokeStyle = bnThreadColor(r, tone, (1 - Math.abs(off) * 1.5) * (0.09 + 0.16 * life));
        g.stroke();
      }
    }
    g.globalCompositeOperation = 'source-over';
  }

  var BN_IDLE = 60000;
  var bnLastActive = performance.now();
  ['pointerdown', 'pointermove', 'keydown'].forEach(function (type) {
    document.addEventListener(type, function () {
      bnLastActive = performance.now();
      if (!bnRaf) bnStartVisual();
    }, { passive: true });
  });

  function bnVisualLoop(now) {
    bnRaf = null;
    if (document.hidden || settings.bg === 'still' || bnCalm()) return;
    // Nobody is looking: leave the last frame up. Sound does not depend on this.
    if (now - bnLastActive > BN_IDLE) return;
    if (bnFrameSeen && now - bnFrameSeen > 45 && now - bnFrameSeen < 500) bnSlowFrames++;
    bnFrameSeen = now;
    if (bnSlowFrames > 20) bnLowPower = true;
    var sounding = bnAnySound();
    // Capped, so drawing never competes with the sound: 30 a second playing, 20 silent.
    if (now - bnLastFrame >= (sounding || bgActive || bgNear(now) ? 33 : 50)) {
      bnLastFrame = now;
      var target = bgActive ? 0.35 : 0;
      if (sounding) {
        var data = new Float32Array(mixGraph.analyser.fftSize);
        mixGraph.analyser.getFloatTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) sum += data[i] * data[i];
        target = Math.min(1, Math.sqrt(Math.sqrt(sum / data.length)) * 1.6);
      }
      bnLevel += (target - bnLevel) * 0.05;
      bnPulse *= 0.93;
      var drawStart = performance.now();
      bnDraw(now);
      if (performance.now() - drawStart > 10) bnSlowFrames++;
    }
    bnRaf = requestAnimationFrame(bnVisualLoop);
  }

  function bnStartVisual() {
    if (bnCalm() || settings.bg === 'still') {
      bnLevel = 0.25;
      bnDraw(0);
    } else if (!bnRaf) {
      bnRaf = requestAnimationFrame(bnVisualLoop);
    }
  }
  document.addEventListener('visibilitychange', function () {
    bnLastActive = performance.now();
    bnStartVisual();
  });

  /* ═══════════════════════════════════════════
     PHONE: KEEP AWAKE, LOCKED-SCREEN LOOP, AIRPLAY
     iPhones suspend live Web Audio when the screen locks, but keep a normal
     audio element playing. This mode records the current noise into a looping
     file for that element, which also gives AirPlay a real file to play.
  ═══════════════════════════════════════════ */
  // Not a multiple of the 30 s noise loop: the end of a recording must be different
  // noise from its start, or the blend at the join sums one sound with itself and phases.
  var BG_SECONDS = 75;
  var BG_OVERLAP = 4;
  var BG_REPEATS = 48; // one hour before the file itself restarts
  var BG_FADE = 2;
  var BG_SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  var bgPlayer = null;
  var bgUrl = null;
  var bgLoaded = null;
  var bgBody = null;
  var bgWaiting = false;
  var bgSwitchTimer = null;
  var bgKey = null;
  var bgJob = 0;
  var bgTimer = null;
  var wakeLock = null;

  function syncWakeLock() {
    var wanted = settings.keepAwake && !settings.background && !document.hidden && (bnPlaying || !!mixOscillators || playingId !== null);
    if (wanted && !wakeLock && navigator.wakeLock) {
      wakeLock = 'pending';
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { if (wakeLock === lock) wakeLock = null; });
        syncWakeLock();
      }).catch(function () { wakeLock = null; }); // refused, as on low battery: sound carries on
    } else if (!wanted && wakeLock && wakeLock !== 'pending') {
      wakeLock.release();
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', syncWakeLock);

  // One player, no handovers: AirPlay can drop a second player starting up. The recording
  // joins onto itself sample for sample and is repeated inside a single long file, so
  // nothing has to happen at the join and no code needs to run while the phone is locked.
  function bgElement() {
    if (!bgPlayer) {
      bgPlayer = new Audio();
      bgPlayer.preload = 'auto';
      bgPlayer.setAttribute('x-webkit-airplay', 'allow');
      bgPlayer.addEventListener('ended', function () {
        if (!bgActive || !bgLoaded) return; // the silent placeholder ends at once: not a restart
        if (bgWaiting) { bgLoad(); return; }
        bgPlayer.currentTime = 0; // the loop setting should cover this; silence must never stay
        bgPlayer.play().catch(function () {});
      });
      // If the phone refuses the long file, a short one still plays, with a small gap at each restart.
      bgPlayer.addEventListener('error', function () {
        if (!bgActive || !bgBody || !bgLoaded || bgBody.short) return;
        bgBody.short = true;
        var old = bgUrl;
        bgUrl = URL.createObjectURL(bgBuildFile(bgBody, 2));
        bgLoad();
        URL.revokeObjectURL(old);
      });
    }
    return bgPlayer;
  }

  function bgLoad() {
    clearTimeout(bgSwitchTimer);
    bgWaiting = false;
    var old = bgLoaded;
    bgLoaded = bgUrl;
    bgPlayer.src = bgUrl;
    bgPlayer.loop = true;
    bgPlayer.play().catch(function () {});
    if (old && old !== bgUrl) URL.revokeObjectURL(old);
  }

  function bgSwitchTo() {
    var el = bgPlayer;
    var longEnough = isFinite(el.duration) && el.duration > BG_FADE * 2;
    if (el.paused || !bgLoaded || !longEnough) { bgLoad(); return; }
    if (bgWaiting) return; // already leaving: the newest recording is picked up on arrival
    // Jumping to the file's own fade-out lets a changed sound leave smoothly, even on
    // iPhones, where a page can't change an audio element's volume.
    bgWaiting = true;
    el.loop = false;
    el.currentTime = el.duration - BG_FADE;
    bgSwitchTimer = setTimeout(function () { if (bgWaiting && bgActive) bgLoad(); }, (BG_FADE + 1) * 1000);
  }

  function wavHeader(frames, rate) {
    var bytes = new DataView(new ArrayBuffer(44));
    function text(at, value) {
      for (var i = 0; i < value.length; i++) bytes.setUint8(at + i, value.charCodeAt(i));
    }
    text(0, 'RIFF');
    bytes.setUint32(4, 36 + frames * 4, true);
    text(8, 'WAVEfmt ');
    bytes.setUint32(16, 16, true);
    bytes.setUint16(20, 1, true);
    bytes.setUint16(22, 2, true);
    bytes.setUint32(24, rate, true);
    bytes.setUint32(28, rate * 4, true);
    bytes.setUint16(32, 4, true);
    bytes.setUint16(34, 16, true);
    text(36, 'data');
    bytes.setUint32(40, frames * 4, true);
    return bytes.buffer;
  }

  function pcmBytes(left, right, from, to, shape) {
    var bytes = new DataView(new ArrayBuffer((to - from) * 4));
    for (var n = from; n < to; n++) {
      var at = (n - from) * 4;
      var level = shape ? shape(n - from, to - from) : 1;
      bytes.setInt16(at, Math.max(-1, Math.min(1, left[n] * level)) * 32767, true);
      bytes.setInt16(at + 2, Math.max(-1, Math.min(1, right[n] * level)) * 32767, true);
    }
    return bytes.buffer;
  }

  function encodeWav(left, right, rate) {
    return new Blob([wavHeader(left.length, rate), pcmBytes(left, right, 0, left.length)], { type: 'audio/wav' });
  }

  // Repeats of one Blob share its memory, so an hour costs little more than one recording.
  function bgBuildFile(body, repeats) {
    var parts = [wavHeader(body.frames * repeats, body.rate), body.start, body.middle];
    for (var i = 0; i < repeats - 2; i++) parts.push(body.whole);
    parts.push(body.lead, body.end);
    return new Blob(parts, { type: 'audio/wav' });
  }

  function bgRender() {
    var rate = 44100;
    var length = (BG_SECONDS + BG_OVERLAP) * rate;
    var overlap = BG_OVERLAP * rate;
    var Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var off = new Offline(2, length, rate);
    var a = bnWire(off, off.destination);
    a.master.gain.value = 1;
    bnApplySound(a);
    var noise = off.createBufferSource();
    noise.buffer = makeNoiseBuffer(off, bn.seed, bn.color);
    noise.loop = true;
    noise.connect(a.input);
    noise.start();
    if (bn.grain > 0) {
      var grain = off.createBufferSource();
      grain.buffer = makeGrainBuffer(off, bn.seed);
      grain.loop = true;
      var grainLevel = off.createGain();
      grainLevel.gain.value = bnGrainAmount();
      grain.connect(grainLevel);
      grainLevel.connect(a.swell);
      grain.start();
    }
    return off.startRendering().then(function (result) {
      var loopFrames = BG_SECONDS * rate;
      var fade = BG_FADE * rate;
      var sides = [0, 1].map(function (c) {
        var out = result.getChannelData(c);
        // The extra seconds at the end blend into the start, so the end meets the start exactly.
        for (var n = 0; n < overlap; n++) {
          var mix = n / overlap;
          out[n] = out[n] * Math.sqrt(mix) + out[loopFrames + n] * Math.sqrt(1 - mix);
        }
        return out.subarray(0, loopFrames);
      });
      // This path has no live limiter, so loud settings are lowered here instead of clipping.
      var peak = 0;
      sides.forEach(function (out) {
        for (var i = 0; i < out.length; i++) peak = Math.max(peak, Math.abs(out[i]));
      });
      if (peak > 0.97) {
        sides.forEach(function (out) {
          for (var i = 0; i < out.length; i++) out[i] *= 0.97 / peak;
        });
      }
      var left = sides[0];
      var right = sides[1];
      var body = {
        frames: loopFrames,
        rate: rate,
        whole: new Blob([pcmBytes(left, right, 0, loopFrames)]),
        // Only the file's very start and end fade: silence in, silence out, none in between.
        start: new Blob([pcmBytes(left, right, 0, fade, function (n, size) { return Math.sqrt(n / size); })]),
        end: new Blob([pcmBytes(left, right, loopFrames - fade, loopFrames, function (n, size) { return Math.sqrt(1 - n / size); })])
      };
      body.middle = body.whole.slice(fade * 4);
      body.lead = body.whole.slice(0, (loopFrames - fade) * 4);
      return body;
    });
  }

  function bgRefresh() {
    var key = JSON.stringify([bn.seed, bn.color, BN_KEYS.map(function (k) { return bn[k]; })]);
    if (key === bgKey && bgUrl) {
      if (bgLoaded !== bgUrl || bgPlayer.paused || bgPlayer.src !== bgUrl) bgSwitchTo();
      return;
    }
    var job = ++bgJob;
    bgRender().then(function (body) {
      if (job !== bgJob || !bgActive) return;
      var old = bgUrl;
      bgBody = body;
      bgUrl = URL.createObjectURL(bgBuildFile(body, BG_REPEATS));
      bgKey = key;
      if (old && old !== bgLoaded) URL.revokeObjectURL(old);
      bgSwitchTo();
    }).catch(function () {
      toast(t('err.play'), 'error');
    });
  }

  function bgStart() {
    // Starts inside the tap, which permits it to play the recording later without one.
    var el = bgElement();
    el.volume = bnVolumeLevel();
    el.loop = false;
    el.src = BG_SILENCE;
    el.play().catch(function () {});
    bgLoaded = null;
    bgActive = true;
    bgRefresh();
  }

  function bgStop() {
    bgActive = false;
    bgJob++;
    bgWaiting = false;
    clearTimeout(bgTimer);
    clearTimeout(bgSwitchTimer);
    if (bgPlayer) bgPlayer.pause();
  }

  function bgQueue() {
    if (!bgActive) return;
    clearTimeout(bgTimer);
    bgTimer = setTimeout(bgRefresh, 600);
  }

  /* ── Versions ── */
  function bnSnapshot() {
    var s = { name: bn.name, savedId: bn.savedId, seed: bn.seed, color: bn.color };
    BN_KEYS.forEach(function (k) { s[k] = bn[k]; });
    return s;
  }

  function bnPersist() {
    try {
      localStorage.setItem(BN_STORE, JSON.stringify({ current: bnSnapshot(), volume: Number(bnEl.volume.value), saved: bnSavedList }));
    } catch (e) { /* private window: settings just last for this visit */ }
  }

  function bnClean(v) {
    var out = { name: String(v.name || 'Your mix').slice(0, 30), savedId: v.savedId || null, seed: Number(v.seed) >>> 0, color: bnColor(v.color).id };
    BN_KEYS.forEach(function (k) { out[k] = clamp(v[k]); });
    return out;
  }

  function bnLoadStored() {
    try {
      var stored = JSON.parse(localStorage.getItem(BN_STORE));
      if (!stored) return;
      if (stored.current) bn = bnClean(stored.current);
      if (typeof stored.volume === 'number') bnEl.volume.value = clamp(stored.volume);
      if (Array.isArray(stored.saved)) bnSavedList = stored.saved.map(function (v) { return Object.assign(bnClean(v), { id: String(v.id) }); });
    } catch (e) { /* nothing usable stored: start from the defaults */ }
  }

  function bnRenderControls() {
    bnEl.name.textContent = bnDisplayName();
    document.getElementById('bnMiniName').textContent = bnDisplayName();
    layersSync();
    Array.prototype.forEach.call(document.getElementById('bnColors').children, function (chip, i) {
      chip.setAttribute('aria-pressed', String(BN_COLORS[i].id === bn.color));
    });
    BN_KEYS.forEach(function (k) {
      var input = document.getElementById('bn-' + k);
      input.value = bn[k];
      input.style.setProperty('--v', bn[k] + '%');
    });
    rangeText();
    var paceOff = bn.swell === 0;
    var pace = document.getElementById('bn-pace');
    pace.disabled = paceOff;
    pace.parentNode.classList.toggle('off', paceOff);
    document.getElementById('bnPaceHint').hidden = !paceOff;
    Array.prototype.forEach.call(bnEl.presets.children, function (chip, i) {
      chip.setAttribute('aria-pressed', String(!bn.savedId && BN_PRESETS[i].name === bn.name));
    });
    bnEl.prev.disabled = !bnHistory.length;
    bnEl.volume.style.setProperty('--v', bnEl.volume.value + '%');
    bnRenderSaved();
  }

  function bnRenderSaved() {
    bnEl.saved.textContent = '';
    if (!bnSavedList.length) {
      var empty = document.createElement('div');
      empty.className = 'bn-empty';
      empty.textContent = t('saved.empty');
      bnEl.saved.appendChild(empty);
      return;
    }
    bnSavedList.forEach(function (version) {
      var item = document.createElement('div');
      item.className = 'bn-saved-item';
      var load = document.createElement('button');
      load.className = 'bn-chip';
      load.textContent = version.name;
      load.setAttribute('aria-pressed', String(bn.savedId === version.id));
      load.addEventListener('click', function () {
        bnRemember();
        bnSetVersion(Object.assign({}, version, { savedId: version.id }));
      });
      var del = document.createElement('button');
      del.className = 'bn-del';
      del.textContent = '✕';
      del.setAttribute('aria-label', t('aria.delete', { n: version.name }));
      del.addEventListener('click', function () {
        var position = bnSavedList.indexOf(version);
        var wasCurrent = bn.savedId === version.id;
        bnSavedList = bnSavedList.filter(function (v) { return v.id !== version.id; });
        if (wasCurrent) {
          bn.savedId = null;
          bn.name = 'Your mix';
          bnUpdateMediaSession();
        }
        bnPersist();
        bnRenderControls();
        toast(t('toast.deleted'), 'info', t('undo'), function () {
          bnSavedList.splice(position, 0, version);
          var unchanged = wasCurrent && !bn.savedId && bn.name === 'Your mix' && bn.seed === version.seed &&
            BN_KEYS.every(function (k) { return bn[k] === version[k]; });
          if (unchanged) {
            bn.savedId = version.id;
            bn.name = version.name;
            bnUpdateMediaSession();
          }
          bnPersist();
          bnRenderControls();
        });
      });
      item.appendChild(load);
      item.appendChild(del);
      bnEl.saved.appendChild(item);
    });

  function bnRemember() {
    bnHistory.push(bnSnapshot());
    if (bnHistory.length > 30) bnHistory.shift();
  }

  function bnSetVersion(next) {
    var clean = bnClean(next);
    var seedChanged = clean.seed !== bn.seed || clean.color !== bn.color;
    bn = clean;
    bnPulse = 1;
    bnApplySound();
    if (seedChanged && bnPlaying && !bgActive) {
      bnStopSource(BN_REGENERATE_FADE);
      bnStartSource(BN_REGENERATE_FADE);
    }
    bnRenderControls();
    bnPersist();
    bnUpdateMediaSession();
    if (!bnRaf) bnStartVisual();
  }

  function bnDisplayName() {
    if (bn.savedId) return bn.name;
    if (bn.name === 'Your mix') return t('mix.your');
    var version = /^Version (\d+)$/.exec(bn.name);
    if (version) return t('version.n', { n: version[1] });
    return I18N.en['preset.' + bn.name] ? t('preset.' + bn.name) : bn.name;
  }

  function bnSurprise() {
    bnRemember();
    bnMadeCount++;
    var next = { name: 'Version ' + bnMadeCount, savedId: null, seed: newSeed(), color: BN_COLORS[Math.floor(Math.random() * BN_COLORS.length)].id };
    BN_KEYS.forEach(function (k) { next[k] = clamp(Math.random() * 100); });
    if (Math.random() < 0.5) next.swell = 0;
    if (Math.random() < 0.6) next.grain = 0;
    next.tone = clamp(15 + Math.random() * 70); // keeps the extremes for deliberate choices
    bnSetVersion(next);
  }

  function bnGenerate() {
    bnRemember();
    bnMadeCount++;
    var next = { name: 'Version ' + bnMadeCount, savedId: null, seed: newSeed(), color: bn.color };
    BN_KEYS.forEach(function (k) {
      // Stays near the current settings, so a new version follows your preferences.
      next[k] = clamp(bn[k] + (Math.random() * 36 - 18));
    });
    if (bn.swell < 8) next.swell = bn.swell; // a steady sound stays steady
    if (bn.grain < 8) next.grain = bn.grain; // and a clean one stays clean
    bnSetVersion(next);
  }

  /* ── Build controls and wire them up ── */

  function bnShowSaveForm(show) {

    } else {

  bnEl.saveCancel.addEventListener('click', function () { bnShowSaveForm(false); });
  bnEl.saveForm.addEventListener('keydown', function (e) {

  bnEl.saveForm.addEventListener('submit', function (e) {

    var name = bnEl.saveName.value.trim() || t('mix.n', { n: bnSavedList.length + 1 });
    var version = Object.assign(bnSnapshot(), { id: String(Date.now()), name: name });

    bnSavedList.push(version);

    bn.savedId = version.id;
